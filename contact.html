        <h2>Contact</h2>
        <p>Use the form below to contact us about your dog care needs. You can also email <a href="mailto:tayari@hawkmail.hfcc.edu">tayari@hawkmail.hfcc.edu</a>.</p>

        <form action="https://formsubmit.co/tahar@example.com" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="topic">Help Topic:</label>
            <select id="topic" name="topic">
                <option>Dog Grooming</option>
                <option>Dog Walking</option>
                <option>Pet Sitting</option>
				<option>Basic Obedience Training</option>
				<option>Behavior Training</option>
				<option>Puppy Training</option>
				<option>Health & Wellness Advice</option>
				<option>Product Recommendations</option>
				<option>Puppy Care Support</option>
                <option>Other</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <input type="submit" value="Send Message">
        </form>
    </main>
